server.port=8082
springdotenv.directory=./file-service

app.s3.endpoint=http://localhost:9000
#app.s3.endpoint=http://minio:9000
app.s3.public-endpoint=http://localhost:9000
app.s3.access-key=${APP_S3_ACCESS_KEY}
app.s3.secret-key=${APP_S3_SECRET_KEY}
app.s3.region=us-east-1
app.s3.bucket=battery-files


#spring.datasource.url=jdbc:postgresql://postgres:5432/batterydb
spring.datasource.url=jdbc:postgresql://localhost:5432/batterydb
spring.datasource.username=admin
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate