services:
  main-application:
    container_name: main-application
    hostname: main-application
    ports:
      - "8080:8080"
    build:
      context: ./main-application
      dockerfile: Dockerfile
    depends_on:
      - db
      - keydb
      - kafka
      - minio
    env_file:
      - ./main-application/.env
    networks:
      - battery_network

  email-service:
    container_name: email-service
    hostname: email-service
    ports:
      - "8081:8080"
    build:
      context: ./email-service
      dockerfile: Dockerfile
    depends_on:
      - kafka
    env_file:
      - ./email-service/.env
    networks:
      - battery_network

  file-service:
    container_name: file-service
    hostname: file-service
    ports:
      - "8082:8080"
    build:
      context: ./file-service
      dockerfile: Dockerfile
    depends_on:
      - kafka
      - minio
    env_file:
      - ./file-service/.env
    networks:
      - battery_network

  db:
    image: postgres:16.1
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=batterydb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - battery_network

  keydb:
    image: "eqalpha/keydb:x86_64_v5.3.3"
    container_name: keydb
    command: "keydb-server /etc/keydb/redis.conf --server-threads 2"
    volumes:
      - "./keydb_data:/data"
    ports:
      - "6379:6379"
    networks:
      - battery_network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_MESSAGE_MAX_BYTES: 209715200
      KAFKA_REPLICA_FETCH_MAX_BYTES: 209715200
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 209715200
    networks:
      - battery_network

  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - battery_network

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/battery-files;
      mc anonymous set none local/battery-files;
      exit 0;
      "
    networks:
      - battery_network

volumes:
  data:
    driver: local

  minio_data:
    driver: local

networks:
  battery_network:
    name: code_battery_network
    driver: bridge